services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: splitflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/splitflow.db
      - PUBLIC_BASE_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - splitflow-data:/app/data
      - splitflow-uploads:/app/uploads
      - ./sample_contracts:/app/sample_contracts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: splitflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  splitflow-data:
    driver: local
  splitflow-uploads:
    driver: local
